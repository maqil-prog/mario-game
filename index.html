<script>
/**
 * محرك الصوت الرجعي (Web Audio API)
 * يولد مؤثرات صوتية للقفز الأول، القفز المزدوج، جمع العملات، القضاء على الشرير، والفوز/الخسارة
 */
class SoundFX {
    constructor() {
        this.ctx = null;
        this.muted = false;
    }

    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playTone(freq, endFreq, duration, type = 'square', volume = 0.12) {
        if (this.muted) return;
        try {
            this.init();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            if (endFreq) {
                osc.frequency.exponentialRampToValueAtTime(endFreq, this.ctx.currentTime + duration);
            }
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
            // تجاهل أخطاء الصوت في حال عدم تفاعل المستخدم بعد
        }
    }

    jump() {
        this.playTone(220, 520, 0.2, 'square', 0.1);
    }

    doubleJump() {
        // صوت أعلى وأكثر حيوية للقفزة الثانية
        this.playTone(380, 880, 0.26, 'triangle', 0.14);
        setTimeout(() => this.playTone(580, 1050, 0.18, 'sine', 0.1), 50);
    }

    coin() {
        this.playTone(987, 1318, 0.18, 'sine', 0.15);
        setTimeout(() => this.playTone(1318, 1568, 0.2, 'sine', 0.15), 70);
    }

/**
 * تنفيذ حركة القفز (القفزة الأولى أو القفزة الثانية الأعلى)
 */
function triggerPlayerJump() {
    if (gameState.status !== 'PLAYING') return;

    if (player.grounded || player.jumpCount === 0) {
        // القفزة الأولى من الأرض أو المنصة
        player.vy = player.jumpPower;
        player.grounded = false;
        player.jumpCount = 1;
        player.spinAngle = 0;
        sfx.jump();
        spawnParticles(player.x + player.width / 2, player.y + player.height, '#ffffff', 6);
        updateHUD();
    } else if (player.jumpCount < player.maxJumps) {

        player.vy = player.doubleJumpPower;

    }

/**
 * بناء وتوليد المرحلة بناءً على رقم المستوى مع تنويع الأقماع الخضراء
 */
function buildLevel(levelNum) {
    platforms = [];
    enemies = [];
    plants = [];
    coins = [];
    particles = [];
    clouds = [];
    hills = [];

    const speedMultiplier = 1 + (levelNum - 1) * 0.22;
    gameState.levelWidth = 3600 + (levelNum - 1) * 600;
    const groundY = 460;

    // إعادة ضبط موقع وحالة اللاعب
    player.x = 80;
    player.y = 320;
    player.vx = 0;
    player.vy = 0;
    player.grounded = false;
    player.jumpCount = 0;
    player.spinAngle = 0;
    player.invulnerable = 0;
    gameState.cameraX = 0;

    // توليد السحب والتلال في الخلفية
    for (let i = 0; i < gameState.levelWidth; i += 320) {
        clouds.push({
            x: i + Math.random() * 120,
            y: 50 + Math.random() * 110,
            scale: 0.8 + Math.random() * 0.5
        });
        hills.push({
            x: i + Math.random() * 150,
            width: 180 + Math.random() * 120,
            height: 90 + Math.random() * 70
        });
    }

    // بناء الأرضية مع وجود حفر (فجوات) للتحدي
    let currentX = 0;
    let pipeIndex = 0;
    while (currentX < gameState.levelWidth) {
        const segWidth = 600 + Math.floor(Math.random() * 350);
        platforms.push({
            x: currentX,
            y: groundY,
            width: segWidth,
            height: 80,
            type: 'ground'
        });

        // إضافة أقماع خضراء (أنابيب) مختلفة الارتفاعات والأشكال والتصاميم
        if (currentX > 320 && currentX < gameState.levelWidth - 520) {
            const pipeX = currentX + segWidth * 0.52;
            const styleVariants = ['classic', 'striped', 'goldRing', 'piranha'];
            const pipeStyle = styleVariants[pipeIndex % styleVariants.length];
            pipeIndex++;

            // تنويع الارتفاعات: قصير (60)، متوسط (95)، وطويل جداً (145) يتطلب قفزاً مزدوجاً!
            let pipeH = 65;
            let pipeW = 58;
            if (pipeStyle === 'striped') {
                pipeH = 100;
                pipeW = 62;
            } else if (pipeStyle === 'goldRing') {
                pipeH = 148; // قمع طويل يتطلب القفزة الثانية العالية
                pipeW = 66;
            } else if (pipeStyle === 'piranha') {
                pipeH = 88;
                pipeW = 64;
            }

            platforms.push({
                x: pipeX,
                y: groundY - pipeH,
                width: pipeW,
                height: pipeH,
                type: 'pipe',
                pipeStyle: pipeStyle
            });

            // إذا كان القمع من نوع النبات المفترس، نضيف نباتاً يتحرك للأعلى والأسفل
            if (pipeStyle === 'piranha') {
                plants.push({
                    x: pipeX + pipeW / 2 - 16,
                    y: groundY - pipeH,
                    baseY: groundY - pipeH,
                    width: 32,
                    height: 42,
                    phase: Math.random() * Math.PI * 2
                });
                // عملات مرتفعة فوق القمع لتشجيع القفز المزدوج لتجنب النبات
                coins.push({ x: pipeX + pipeW / 2, y: groundY - pipeH - 95, radius: 14, collected: false, bobOffset: 0 });
                coins.push({ x: pipeX + pipeW / 2, y: groundY - pipeH - 135, radius: 14, collected: false, bobOffset: 1 });
            } else {
                // وضع عملات ذهبية فوق القمع
                coins.push({ x: pipeX + pipeW / 2, y: groundY - pipeH - 42, radius: 14, collected: false, bobOffset: Math.random() * 6 });
                coins.push({ x: pipeX + pipeW / 2, y: groundY - pipeH - 82, radius: 14, collected: false, bobOffset: Math.random() * 6 });
            }
        }

        // إضافة شرير يجري على هذه القطعة من الأرض
        if (currentX > 250 && currentX < gameState.levelWidth - 400) {
            enemies.push({
                x: currentX + segWidth * 0.25,
                y: groundY - 38,
                width: 38,
                height: 38,
                vx: -2.2 * speedMultiplier,
                vy: 0,
                minX: currentX + 10,
                maxX: currentX + segWidth - 48,
                alive: true,
                squashTimer: 0,
                walkFrame: 0
            });
        }

        // الانتقال لما بعد الفجوة (حفرة صغيرة)
        const gapWidth = currentX < gameState.levelWidth - 800 ? (115 + Math.random() * 45) : 0;
        currentX += segWidth + gapWidth;
    }

    // ضمان وجود أرضية صلبة عند البداية والنهاية
    platforms[0].width = Math.max(platforms[0].width, 650);
    platforms.push({
        x: gameState.levelWidth - 450,
        y: groundY,
        width: 550,
        height: 80,
        type: 'ground'
    });

    // إضافة منصات طوب معلقة في الهواء وعملات ذهبية وأشرار فوقها
    for (let px = 420; px < gameState.levelWidth - 550; px += 400) {
        const platY = 250 + (Math.random() > 0.5 ? -45 : 15);
        const platW = 160 + Math.floor(Math.random() * 3) * 40;
        platforms.push({
            x: px,
            y: platY,
            width: platW,
            height: 32,
            type: 'brick'
        });

        // صف من العملات الذهبية فوق المنصة
        const coinCount = Math.floor(platW / 42);
        for (let c = 0; c < coinCount; c++) {
            coins.push({
                x: px + 22 + c * 40,
                y: platY - 36,
                radius: 14,
                collected: false,
                bobOffset: c * 0.7
            });
        }

        // أحياناً نضع شريراً يجري فوق المنصة العلوية
        if (platW >= 200) {
            enemies.push({
                x: px + platW / 2,
                y: platY - 38,
                width: 38,
                height: 38,
                vx: 1.8 * speedMultiplier,
                vy: 0,
                minX: px,
                maxX: px + platW - 38,
                alive: true,
                squashTimer: 0,
                walkFrame: 0
            });
        }
    }

    // تحديد موقع علم النهاية
    goalFlag = {
        x: gameState.levelWidth - 220,
        y: groundY - 280,
        width: 14,
        height: 280
    };

    updateHUD();
}

/**
 * رسم الأقماع الخضراء بتصاميم وأحجام مختلفة ومتنوعة
 */
function drawStyledPipe(plat) {
    const style = plat.pipeStyle || 'classic';

    if (style === 'classic') {
        // 1. القمع الكلاسيكي الأخضر الفاتح اللامع
        ctx.fillStyle = '#2e7d32';
        ctx.fillRect(plat.x + 5, plat.y + 18, plat.width - 10, plat.height - 18);
        ctx.fillStyle = '#66bb6a';
        ctx.fillRect(plat.x + 11, plat.y + 18, 10, plat.height - 18);

        // الفوهة العلوية
        ctx.fillStyle = '#388e3c';
        ctx.fillRect(plat.x, plat.y, plat.width, 20);
        ctx.fillStyle = '#81c784';
        ctx.fillRect(plat.x + 6, plat.y + 2, 10, 16);
        ctx.strokeStyle = '#1b5e20';
        ctx.lineWidth = 2;
        ctx.strokeRect(plat.x, plat.y, plat.width, 20);

    } else if (style === 'striped') {
        // 2. قمع أخضر زمردي مخطط بحلقات أفقية بارزة
        ctx.fillStyle = '#00695c';
        ctx.fillRect(plat.x + 5, plat.y + 20, plat.width - 10, plat.height - 20);
        ctx.fillStyle = '#26a69a';
        ctx.fillRect(plat.x + 12, plat.y + 20, 8, plat.height - 20);

        // خطوط زخرفية أفقية
        ctx.fillStyle = '#004d40';
        for (let sy = plat.y + 34; sy < plat.y + plat.height - 10; sy += 22) {
            ctx.fillRect(plat.x + 5, sy, plat.width - 10, 5);
        }

        // فوهة مزدوجة الحواف
        ctx.fillStyle = '#00897b';
        ctx.fillRect(plat.x, plat.y, plat.width, 22);
        ctx.strokeStyle = '#004d40';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(plat.x, plat.y, plat.width, 22);

    } else if (style === 'goldRing') {
        // 3. قمع ملكي طويل بطوق ذهبي لامع (يتطلب القفز المزدوج)
        ctx.fillStyle = '#1b5e20';
        ctx.fillRect(plat.x + 6, plat.y + 22, plat.width - 12, plat.height - 22);
        ctx.fillStyle = '#43a047';
        ctx.fillRect(plat.x + 12, plat.y + 22, 11, plat.height - 22);

        // طوق ذهبي في منتصف القمع
        const midY = plat.y + plat.height * 0.52;
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(plat.x + 3, midY, plat.width - 6, 12);
        ctx.strokeStyle = '#ff8f00';
        ctx.lineWidth = 2;
        ctx.strokeRect(plat.x + 3, midY, plat.width - 6, 12);

        // الفوهة العلوية بحافة ذهبية
        ctx.fillStyle = '#2e7d32';
        ctx.fillRect(plat.x, plat.y, plat.width, 22);
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(plat.x, plat.y + 18, plat.width, 5);
        ctx.strokeStyle = '#0d3b10';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(plat.x, plat.y, plat.width, 22);

    } else if (style === 'piranha') {
        // 4. قمع الخطر المنقط (يخرج منه نبات آكل اللحوم)
        ctx.fillStyle = '#33691e';
        ctx.fillRect(plat.x + 5, plat.y + 20, plat.width - 10, plat.height - 20);
        ctx.fillStyle = '#7cb342';
        ctx.fillRect(plat.x + 11, plat.y + 20, 9, plat.height - 20);

        // مسامير/نقاط تحذيرية على جسم القمع
        ctx.fillStyle = '#c5e1a5';
        ctx.beginPath();
        ctx.arc(plat.x + 16, plat.y + 42, 3.5, 0, Math.PI * 2);
        ctx.arc(plat.x + plat.width - 16, plat.y + 42, 3.5, 0, Math.PI * 2);
        ctx.arc(plat.x + 16, plat.y + 68, 3.5, 0, Math.PI * 2);
        ctx.arc(plat.x + plat.width - 16, plat.y + 68, 3.5, 0, Math.PI * 2);
        ctx.fill();

        // الفوهة العلوية العريضة
        ctx.fillStyle = '#558b2f';
        ctx.fillRect(plat.x - 2, plat.y, plat.width + 4, 20);
        ctx.strokeStyle = '#1b5e20';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(plat.x - 2, plat.y, plat.width + 4, 20);
    }
}

/**
 * رسم النباتات آكلة اللحوم التي تخرج من الأقماع الخضراء

function drawPiranhaPlants() {
    for (const plant of plants) {
        const visibleHeight = plant.baseY - plant.y;
        if (visibleHeight <= 2) continue;

        ctx.save();
        // قص الرسم عند حافة فوهة القمع حتى يبدو النبات خارجاً من الداخل
        ctx.beginPath();
        ctx.rect(plant.x - 10, plant.y - 10, plant.width + 20, visibleHeight + 10);
        ctx.clip();

        // الساق الخضراء
        ctx.fillStyle = '#4caf50';
        ctx.fillRect(plant.x + plant.width / 2 - 4, plant.y + 20, 8, visibleHeight);

        // رأس النبات الأحمر المنقط بالأبيض
        const headX = plant.x + plant.width / 2;
        const headY = plant.y + 16;
        ctx.fillStyle = '#d32f2f';
        ctx.beginPath();
        ctx.arc(headX, headY, 15, 0, Math.PI * 2);
        ctx.fill();

        // فم النبات المفتوح والأسنان البيضاء
        const mouthAngle = 0.25 + Math.abs(Math.sin(gameState.frameCount * 0.15)) * 0.35;
        ctx.fillStyle = '#212121';
        ctx.beginPath();
        ctx.moveTo(headX, headY);
        ctx.arc(headX, headY, 15, -Math.PI / 2 - mouthAngle, -Math.PI / 2 + mouthAngle);
        ctx.closePath();
        ctx.fill();

        // نقاط بيضاء على الرأس
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(headX - 8, headY + 2, 2.5, 0, Math.PI * 2);
        ctx.arc(headX + 8, headY + 2, 2.5, 0, Math.PI * 2);
        ctx.arc(headX, headY + 9, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

function setupControls() {
    window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
            if (gameState.status === 'PLAYING') e.preventDefault();
            if (!player.jumpPressedLock) {
                player.jumpPressedLock = true;
                keys.jump = true;
                triggerPlayerJump();
            }
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
            keys.jump = false;
            player.jumpPressedLock = false;
        }
    });

    // ربط أزرار الشاشة اللمسية والفأرة
    const bindTouchButton = (btnId, keyName) => {
        const btn = document.getElementById(btnId);
        const startPress = (e) => {
            e.preventDefault();
            sfx.init();
            keys[keyName] = true;
            btn.classList.add('pressed');
            if (keyName === 'jump' && !player.jumpPressedLock) {
                player.jumpPressedLock = true;
                triggerPlayerJump();
            }
        };
        const endPress = (e) => {
            e.preventDefault();
            keys[keyName] = false;
            btn.classList.remove('pressed');
            if (keyName === 'jump') {
                player.jumpPressedLock = false;
            }
        };

        btn.addEventListener('touchstart', startPress, { passive: false });
        btn.addEventListener('touchend', endPress, { passive: false });
        btn.addEventListener('touchcancel', endPress, { passive: false });
        btn.addEventListener('mousedown', startPress);
        btn.addEventListener('mouseup', endPress);
        btn.addEventListener('mouseleave', endPress);
    };
